name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    # Skip before allocating a runner if the repository is private.
    # Standard runners are free for public repositories:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          # Dependency caching is disabled by default; do not enable it.
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests with simulated providers
        run: python -m unittest discover -s tests -v
      - name: Check source and wheel packages
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
