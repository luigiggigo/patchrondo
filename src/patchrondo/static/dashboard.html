<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>PatchRondo</title>
<link rel="icon" href="__RONDO_HEAD__">
<style nonce="__NONCE__">
:root {
  color-scheme: dark;
  --bg: #0b0b0d;
  --sidebar: rgba(30, 30, 33, 0.72);
  --card: rgba(28, 28, 30, 0.86);
  --card-2: #2c2c2e;
  --card-hover: rgba(255, 255, 255, 0.04);
  --sep: rgba(84, 84, 88, 0.48);
  --sep-soft: rgba(84, 84, 88, 0.26);
  --label: #f5f5f7;
  --label-2: rgba(235, 235, 245, 0.62);
  --label-3: rgba(235, 235, 245, 0.32);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-2: rgba(118, 118, 128, 0.16);
  --blue: #0a84ff;
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --purple: #bf5af2;
  --teal: #64d2ff;
  --gray: #8e8e93;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.25, .8, .25, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--label);
  font: 14px/1.45 var(--font);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(1100px 620px at 85% -15%, rgba(10, 132, 255, 0.13), transparent 62%),
    radial-gradient(900px 560px at -10% 115%, rgba(191, 90, 242, 0.09), transparent 60%);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid rgba(10, 132, 255, 0.55); outline-offset: 2px; border-radius: 8px; }
svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Layout */
.app { position: relative; display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.sidebar {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--sidebar);
  -webkit-backdrop-filter: saturate(180%) blur(28px); backdrop-filter: saturate(180%) blur(28px);
  border-right: 0.5px solid var(--sep);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 22px 18px 14px; cursor: pointer; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none; overflow: hidden;
  background: url("__RONDO_HEAD__") center 30% / 118% no-repeat, linear-gradient(160deg, #3d9bff, #0a6cff 55%, #5e3dff);
  box-shadow: 0 6px 18px rgba(10, 132, 255, 0.35), inset 0 0.5px 0 rgba(255, 255, 255, 0.4);
  transition: transform .3s var(--ease);
}
.brand:hover .brand-mark { transform: rotate(-6deg) scale(1.06); }
.brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.brand-tag { font-size: 12px; color: var(--label-2); }

.search {
  margin: 0 14px 10px; display: flex; align-items: center; gap: 7px; padding: 0 9px; height: 32px;
  background: var(--fill-2); border-radius: 9px; color: var(--label-2);
}
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--label); font: inherit; }
.search input::placeholder { color: var(--label-3); }
.search:focus-within { box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.45); }

.segmented {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px;
  background: var(--fill-2); border-radius: 9px;
}
.segmented button {
  height: 26px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--label-2);
  transition: background .2s var(--ease), color .2s var(--ease);
}
.segmented button[aria-pressed="true"] { background: #636366; color: var(--label); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
.segmented button:disabled { opacity: .35; cursor: default; }
.sidebar .segmented { margin: 0 14px 8px; }

.list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; min-height: 0; }
.list-label { padding: 12px 10px 6px; font-size: 11.5px; font-weight: 600; color: var(--label-3); text-transform: uppercase; letter-spacing: .04em; }
.row {
  width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; text-align: left;
  transition: background .15s var(--ease);
}
.row:hover { background: var(--card-hover); }
.row[aria-current="true"] { background: var(--blue); }
.row[aria-current="true"] .row-sub, .row[aria-current="true"] .row-time { color: rgba(255, 255, 255, 0.78); }
.row[aria-current="true"] .dot { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-time { font-size: 11.5px; color: var(--label-3); align-self: flex-start; padding-top: 2px; font-variant-numeric: tabular-nums; }
.list-empty { padding: 28px 16px; text-align: center; color: var(--label-3); font-size: 13px; }

.sidebar-foot {
  display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 0.5px solid var(--sep);
  font-size: 12px; color: var(--label-2); min-width: 0;
}
.sidebar-foot .repo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 6px; flex: none; }

.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--tone, var(--gray)); }
.pulse { animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
.tone-blue { --tone: var(--blue); } .tone-green { --tone: var(--green); } .tone-orange { --tone: var(--orange); }
.tone-red { --tone: var(--red); } .tone-purple { --tone: var(--purple); } .tone-gray { --tone: var(--gray); } .tone-teal { --tone: var(--teal); }

/* Detail */
.detail { overflow-y: auto; min-width: 0; scroll-behavior: smooth; }
.toolbar {
  position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 28px;
  background: rgba(11, 11, 13, 0.7); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 0.5px solid transparent; transition: border-color .2s var(--ease);
}
.detail.scrolled .toolbar { border-bottom-color: var(--sep); }
.toolbar-title { flex: 1; min-width: 0; font-weight: 600; opacity: 0; transform: translateY(4px); transition: all .25s var(--ease); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail.scrolled .toolbar-title { opacity: 1; transform: none; }
.back { display: none; align-items: center; gap: 2px; color: var(--blue); font-weight: 500; }
.back svg.icon { width: 20px; height: 20px; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px;
  background: var(--fill-2); color: var(--label); font-size: 13px; font-weight: 500; transition: background .15s var(--ease);
}
.tool-btn:hover { background: var(--fill); }
.tool-btn .mono { color: var(--label-2); }

.content { max-width: 980px; margin: 0 auto; padding: 8px 28px 64px; }
.hero { padding: 14px 0 22px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--label-2); margin-bottom: 6px; }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: 0; }
h1 { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.agents { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.agent { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--fill-2); font-weight: 520; }
.agent-avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; }
.agent-avatar.claude { background: linear-gradient(150deg, #e3895f, #c15f3c); }
.agent-avatar.codex { background: linear-gradient(150deg, #4f4f55, #1d1d20); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.3); }
.agent-role { color: var(--label-3); font-size: 12px; font-weight: 400; }
.agents .arrow { color: var(--label-3); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: var(--tone);
  background: color-mix(in srgb, var(--tone) 16%, transparent);
}
.pill .dot { width: 7px; height: 7px; }

.card {
  background: var(--card); border-radius: var(--radius); border: 0.5px solid var(--sep-soft);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px rgba(0, 0, 0, 0.25);
}
.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 9px; }
h2 { margin: 0; font-size: 20px; font-weight: 680; letter-spacing: -0.02em; }
.section-note { font-size: 12.5px; color: var(--label-2); }

/* Stepper */
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); padding: 18px 20px 16px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12.5px; color: var(--label-3); text-align: center; }
.step::before {
  content: ""; position: absolute; top: 11px; right: 50%; width: 100%; height: 2px; border-radius: 2px; background: var(--fill);
}
.step:first-child::before { display: none; }
.step.done::before, .step.current::before { background: var(--green); }
.step-node {
  position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card-2); box-shadow: inset 0 0 0 2px var(--fill);
}
.step.done { color: var(--label-2); }
.step.done .step-node { background: var(--green); box-shadow: none; color: #000; }
.step.done .step-node svg.icon { width: 13px; height: 13px; stroke-width: 3; }
.step.current { color: var(--label); font-weight: 600; }
.step.current .step-node { background: var(--tone); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tone) 22%, transparent); }
.step.current .step-node::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.stat { padding: 14px 16px 15px; }
.stat-label { font-size: 12px; font-weight: 550; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
.stat-value { margin-top: 6px; font-size: 24px; font-weight: 680; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value small { font-size: 15px; font-weight: 550; color: var(--label-3); }
.meter { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--tone, var(--blue)); transition: width .5s var(--ease); }

/* Alert */
.alert { display: flex; gap: 12px; padding: 14px 16px; margin-top: 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--tone) 12%, transparent); border: 0.5px solid color-mix(in srgb, var(--tone) 35%, transparent); }
.alert > svg.icon { color: var(--tone); width: 20px; height: 20px; margin-top: 1px; }
.alert-title { font-weight: 620; }
.alert-body { color: var(--label-2); margin-top: 2px; overflow-wrap: anywhere; }

/* Grouped lists */
.group > .item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; position: relative; }
.group > .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 540; overflow-wrap: anywhere; }
.item-sub { font-size: 12.5px; color: var(--label-2); margin-top: 1px; overflow-wrap: anywhere; }
.item-trail { flex: none; font-size: 12.5px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.setting { align-items: center; }
.setting .item-main { flex: none; }
.setting .item-trail { flex: 1; min-width: 0; text-align: right; overflow-wrap: anywhere; }
.empty-row { padding: 18px 16px; color: var(--label-3); text-align: center; }
.sev { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 650; text-transform: capitalize; color: var(--tone); background: color-mix(in srgb, var(--tone) 15%, transparent); flex: none; min-width: 62px; justify-content: center; }
.summary { padding: 16px; font-size: 14.5px; color: var(--label); border-bottom: 0.5px solid var(--sep); }
.verdict { display: flex; align-items: center; gap: 12px; padding: 16px 16px 0; }
.verdict-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--tone); background: color-mix(in srgb, var(--tone) 16%, transparent); flex: none; }
.verdict-icon svg.icon { width: 19px; height: 19px; stroke-width: 2.4; }
.verdict-title { font-size: 16px; font-weight: 650; }

/* Timeline */
.timeline .item { padding-left: 48px; }
.timeline .item .tl-dot { position: absolute; left: 20px; top: 17px; width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 18%, transparent); }
.timeline .item:last-child .tl-line { display: none; }
.timeline .item .tl-line { position: absolute; left: 24.5px; top: 30px; bottom: -14px; width: 1px; background: var(--sep); }
.chip { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--label-2); background: var(--fill-2); }

/* Documents */
.doc-head { padding: 12px; border-bottom: 0.5px solid var(--sep); }
.doc-head .segmented { max-width: 420px; }
.md { padding: 6px 20px 20px; overflow-wrap: anywhere; color: rgba(245, 245, 247, 0.92); }
.md h3, .md h4, .md h5, .md h6 { margin: 18px 0 6px; letter-spacing: -0.015em; }
.md h3 { font-size: 19px; } .md h4 { font-size: 16px; } .md h5, .md h6 { font-size: 14px; color: var(--label-2); }
.md p { margin: 8px 0; }
.md ul { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--label-3); }
.md code { font-family: var(--mono); font-size: 12.5px; padding: 1px 6px; border-radius: 6px; background: var(--fill-2); }
.md pre { margin: 10px 0; padding: 12px 14px; border-radius: 10px; background: rgba(0, 0, 0, 0.35); border: 0.5px solid var(--sep-soft); overflow-x: auto; }
.md pre code { padding: 0; background: none; font-size: 12.5px; line-height: 1.55; white-space: pre; }

/* Overview */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; text-align: left; transition: transform .2s var(--ease), border-color .2s var(--ease); }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--tone) 45%, transparent); }
.tile-icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tone); color: #fff; }
.tile-icon svg.icon { width: 15px; height: 15px; stroke-width: 2.4; }
.tile-count { margin-top: 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.tile-label { font-size: 13px; color: var(--label-2); font-weight: 550; }
.badge-on { color: var(--green); font-weight: 600; } .badge-off { color: var(--label-3); font-weight: 600; }
.welcome { padding: 40px 24px; text-align: center; color: var(--label-2); }
.welcome .rondo { width: 150px; height: 150px; margin: 0 auto 10px; }
.welcome h2 { color: var(--label); margin-bottom: 6px; }
.welcome .btn { margin-top: 18px; }
.welcome pre { display: inline-block; text-align: left; margin-top: 16px; padding: 12px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.35); font: 12.5px/1.6 var(--mono); color: var(--label); }

/* Rondo, the mascot */
.rondo { background: url("__RONDO__") center / contain no-repeat; filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.35)) drop-shadow(0 12px 22px rgba(0, 0, 0, 0.5)); flex: none; }
.rondo-face { width: 40px; height: 40px; border-radius: 50%; flex: none; background: url("__RONDO_HEAD__") center 30% / 118% no-repeat, radial-gradient(circle at 50% 30%, #3a3a40, #1c1c1e); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18); }
.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-3deg); } }
.hop { animation: hop .9s var(--ease) 2; }
@keyframes hop { 0%, 100% { transform: none; } 35% { transform: translateY(-9px) rotate(6deg); } 65% { transform: translateY(0) rotate(-4deg); } }
.hero-row { display: flex; align-items: flex-end; gap: 18px; }
.hero-row > :first-child { flex: 1; min-width: 0; }
.hero .rondo { width: 112px; height: 112px; margin-bottom: -10px; }
.bubble {
  position: relative; max-width: 300px; margin-bottom: 52px; padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  background: var(--card-2); color: var(--label); font-size: 13px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
}
.note { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 16px 10px 10px; }
.note .item-sub { margin: 0; }
.note-who { font-size: 12px; font-weight: 600; color: var(--label-3); }
.list-empty .rondo { width: 72px; height: 72px; margin: 0 auto 10px; opacity: .8; }
.loading { padding: 64px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--label-2); }
.loading .rondo-face { width: 56px; height: 56px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  padding: 10px 16px; border-radius: 999px; font-weight: 550; display: flex; align-items: center; gap: 8px;
  background: rgba(58, 58, 60, 0.85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); transition: all .3s var(--ease); z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast svg.icon { color: var(--green); }
.toast.error svg.icon { color: var(--red); }

/* Controls */
.brand-row { display: flex; align-items: center; padding-right: 14px; }
.brand-row .brand { flex: 1; min-width: 0; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--fill-2); color: var(--blue); transition: background .15s var(--ease), transform .15s var(--ease);
}
.icon-btn:hover { background: var(--fill); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg.icon { width: 17px; height: 17px; stroke-width: 2.4; }
.tool-btn.primary, .btn.primary { background: var(--blue); color: #fff; }
.tool-btn.primary:hover, .btn.primary:hover { background: #2b95ff; }
.tool-btn:disabled, .btn:disabled { opacity: .55; cursor: default; }
.tool-btn.status { background: color-mix(in srgb, var(--purple) 16%, transparent); color: var(--purple); --tone: var(--purple); opacity: 1; }
.btn {
  height: 34px; padding: 0 16px; border-radius: 9px; font-weight: 560; background: var(--fill-2);
  transition: background .15s var(--ease), transform .1s var(--ease);
}
.btn:hover { background: var(--fill); }
.btn:active:not(:disabled) { transform: scale(.97); }
.link-btn { color: var(--blue); font-weight: 500; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }

/* Sheets and alerts */
.backdrop {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, 0.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: fadebg .2s var(--ease);
}
@keyframes fadebg { from { opacity: 0; } }
.sheet, .alert-dialog {
  width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: 16px;
  background: #1c1c1e; border: 0.5px solid var(--sep); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: pop .28s var(--ease);
}
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } }
.sheet-head { padding: 18px 20px 4px; }
.sheet-head h3, .alert-dialog h3 { margin: 0; font-size: 18px; font-weight: 680; letter-spacing: -0.02em; }
.sheet-head p { margin: 4px 0 0; color: var(--label-2); font-size: 13px; }
.sheet-body { padding: 12px 20px 4px; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px 18px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--label-2); }
.field-hint { font-size: 12px; color: var(--label-3); }

const STEPS = [["develop", "Develop"], ["test", "Test"], ["review", "Review"], ["complete", "Done"]];
const VERDICTS = {

const $ = (id) => document.getElementById(id);

function icon(name) {

// All dynamic text is inserted as text nodes: task data comes from agents and is untrusted.

// What Rondo says about the whole board.
function boardMessage(counts, total, cfg) {
  if (!cfg) return "I can't read the configuration yet. Run patchrondo init in your repository.";
  if (!total) return "Nothing to patch yet. Give me a task!";
  if (counts.running) return `${plural(counts.running, "task")} in the loop. I'm keeping an eye on ${counts.running === 1 ? "it" : "them"}.`;
  const attention = counts.paused + counts.blocked;
  if (attention) return `${plural(attention, "task")} ${attention === 1 ? "needs" : "need"} your attention.`;
  if (counts.ready) return `${plural(counts.ready, "task")} ready. Press Run when you are.`;
  return "Everything is patched up. Nice work!";
}

// What Rondo says about one task.
function taskMessage(detail) {
  const task = detail.state;
  const dev = agentName(task.developer), rev = agentName(task.reviewer);
  const verdict = task.review?.verdict;
  if (task.status === "done") return `All patched up! ${rev} approved the work.`;
  if (task.status === "blocked") return "I'm stuck on this one. Check the details below before trying again.";
  if (task.status === "paused" && task.recovery?.status === "scheduled")
    return `${agentName(task.recovery.provider)} hit a usage limit. A retry is planned; it needs a run with automatic resume to be waiting.`;
  if (task.status === "paused") return verdict === "CHANGES_REQUESTED"
    ? `Paused after ${rev} asked for changes. Resume to send the feedback back to ${dev}.`
    : "Paused. Resume picks up from the last checkpoint.";
  if (task.status === "running" && !detail.locked) return "This run stopped unexpectedly. Resume continues from the last checkpoint.";
  if (task.status === "running") {
    if (task.phase === "review") return `${rev} is reviewing ${dev}'s changes…`;
    if (task.phase === "test") return "Running the project tests…";
    return `${dev} is working on iteration ${task.iteration || 1}…`;
  }
  return `Ready when you are. ${dev} develops, ${rev} reviews.`;
}

function rondoNote(detail) {
  const status = detail.state.status;
  const motion = status === "running" && detail.locked ? " bob" : status === "done" ? " hop" : "";
  return h("div", { class: "card note", role: "status" },
    h("div", { class: `rondo-face${motion}`, "aria-hidden": "true" }),
    h("div", { class: "item-main" }, h("div", { class: "note-who" }, "Rondo"), h("div", { class: "item-sub" }, taskMessage(detail))));
}

function statusOf(name) { return STATUS[name] || { label: name || "Unknown", tone: "gray", icon: "clock" }; }
function agentName(name) { return AGENTS[name] || name || "?"; }

const relative = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
function ago(iso, short) {
  const time = Date.parse(iso);
  if (!Number.isFinite(time)) return "";
  const seconds = Math.round((time - Date.now()) / 1000);
  const units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  if (short) {
    const abs = Math.abs(seconds);
    if (abs < 60) return "now";
    for (const [unit, size] of units) if (abs >= size) return Math.floor(abs / size) + (unit === "month" ? "mo" : unit[0]);
  }
  for (const [unit, size] of units) if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);

}

function humanize(text) {

}

function inline(text) {

  while ((match = pattern.exec(text))) {

    const piece = match[0];
    out.push(piece[0] === "`" ? h("code", {}, piece.slice(1, -1)) : h("strong", {}, piece.slice(2, -2)));
    last = pattern.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function markdown(text) {
  const root = h("div", { class: "md" });
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  let list = null, paragraph = [];
  const flush = () => {
    if (paragraph.length) root.append(h("p", {}, inline(paragraph.join(" "))));
    paragraph = [];
    list = null;
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      root.append(h("pre", {}, h("code", {}, code.join("\n"))));
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) { flush(); root.append(h("h" + Math.min(heading[1].length + 2, 6), {}, inline(heading[2]))); continue; }
    const item = line.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (item) {
      if (!list) { flush(); list = h("ul"); root.append(list); }
      list.append(h("li", {}, inline(item[1])));
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    if (list && /^\s+\S/.test(line)) { list.lastChild.append(" ", ...inline(line.trim())); continue; }
    list = null;
    paragraph.push(line.trim());
  }
  flush();
  return root;
}

async function api(path) {
  const response = await fetch(path, { headers: { "X-PatchRondo-Token": token }, cache: "no-store" });
  if (!response.ok) {
    const error = new Error(`HTTP ${response.status}`);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", cache: "no-store", body: JSON.stringify(body),
    headers: { "X-PatchRondo-Token": token, "Content-Type": "application/json" },
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function modal(build, className = "sheet") {
  const previous = document.activeElement;
  const onKey = (event) => { if (event.key === "Escape") close(); };
  const backdrop = h("div", { class: "backdrop", onmousedown: (event) => { if (event.target === backdrop) close(); } });

    backdrop.remove();
    document.removeEventListener("keydown", onKey);
    previous?.focus?.();

  backdrop.append(h("div", { class: className, role: "dialog", "aria-modal": "true" }, build(close)));

}

}

function busy(button, label) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = label;
  return () => { button.disabled = false; button.textContent = original; };
}

function newTaskSheet() {
  if (!state.overview?.config) { toast("Configuration unavailable", true); return; }
  modal((close) => {
    const title = h("input", { class: "input", required: true, maxlength: 200, placeholder: "Handle JWT expiration" });

    const submit = h("button", { type: "submit", class: "btn primary" }, "Create Task");
    return h("form", {
      onsubmit: async (event) => {
        event.preventDefault();
        error.textContent = "";
        const restore = busy(submit, "Creating…");
        try {
          const result = await post("/api/tasks", {
            title: title.value, description: description.value, acceptance: acceptance.value.split("\n"), ...roles,
          });
          close();
          toast("Task created");
          await refresh();
          select(result.id);
        } catch (err) {
          error.textContent = err.message;
          restore();
        }
      },
    },
      h("div", { class: "sheet-head" }, h("h3", {}, "New Task"),
        h("p", {}, "Creates a dedicated Git worktree. Nothing runs until you press Run.")),
      h("div", { class: "sheet-body" },
        field("Title", title),
        field("Description", description),
        field("Acceptance criteria", acceptance, "One per line. Optional."),
        h("div", { class: "field-row" },
          h("div", { class: "field" }, h("span", { class: "field-label" }, "Developer"), segmented(agents, roles.developer, (v) => { roles.developer = v; })),

      h("div", { class: "sheet-foot" }, h("button", { type: "button", class: "btn", onclick: close }, "Cancel"), submit));
  });
}

function testsSheet() {
  const cfg = state.overview?.config;
  if (!cfg) return;
  modal((close) => {
    const enabled = h("input", { type: "checkbox", class: "switch", checked: cfg.tests_enabled, "aria-label": "Run project tests" });

    const submit = h("button", { type: "submit", class: "btn primary" }, "Save");
    return h("form", {
      onsubmit: async (event) => {
        event.preventDefault();
        error.textContent = "";

          await post("/api/settings/tests", { enabled: enabled.checked, trust_acknowledged: trust.checked, commands: commands.value.split("\n") });
          close();
          toast("Test settings saved");
          await refresh();

          error.textContent = err.message;
          restore();
        }
      },
    },
      h("div", { class: "sheet-head" }, h("h3", {}, "Project Tests"),

function runLabel(detail) {
  const status = detail.state.status;
  if (status === "ready") return "Run";
  if (status === "paused" || (status === "running" && !detail.locked)) return "Resume";
  return null;
}

function confirmRun(detail) {
  const task = detail.state;
  const label = runLabel(detail);
  const cfg = state.overview?.config;
  modal((close) => {
    const go = h("button", {
      type: "button", class: "primary",
      onclick: async () => {
        go.disabled = true;
        try {
          await post(`/api/tasks/${encodeURIComponent(task.id)}/run`, {});
          close();
          toast(`${label === "Run" ? "Started" : "Resumed"} · progress updates live`);
          setTimeout(refresh, 700);
        } catch (err) {
          close();
          toast(err.message, true);
        }
      },
    }, label);
    return [
      h("div", { class: "alert-dialog-body" },
        h("h3", {}, `${label} “${task.title}”?`),
        h("p", {}, `${agentName(task.developer)} develops and ${agentName(task.reviewer)} reviews in the task worktree. This calls the real CLIs and uses your plan quota.`),
        cfg?.recovery_enabled ? h("p", {}, "Automatic quota recovery is enabled: after a usage limit this run keeps waiting and retries within the configured limits.") : null,
        cfg && !cfg.tests_enabled ? h("p", { class: "warn" }, "Tests are disabled: the task will pause after the first review.") : null),
      h("div", { class: "alert-actions" }, h("button", { type: "button", onclick: close }, "Cancel"), go),

function matchesFilter(task) {

  return true;
}

  const query = state.query.trim().toLowerCase();
  return (state.overview?.tasks || []).filter((task) => matchesFilter(task) &&
    (!query || `${task.title} ${task.id}`.toLowerCase().includes(query)));
}

function setHash() {
  const params = new URLSearchParams({ token });
  if (state.selected) params.set("task", state.selected);
  history.replaceState(null, "", "#" + params.toString());
}

function select(id) {
  state.selected = id;
  state.detail = null;
  state.detailKey = "";
  state.doc = "task";
  setHash();
  $("app").classList.toggle("show-detail", Boolean(id));
  renderList();
  renderDetail();
  $("detail").scrollTop = 0;
  if (id) refreshDetail();
}

function renderFilters() {
  const counts = { all: 0, active: 0, done: 0, blocked: 0 };
  for (const task of state.overview?.tasks || []) {
    counts.all++;
    if (["ready", "running", "paused"].includes(task.status)) counts.active++;
    if (task.status in counts) counts[task.status]++;
  }
  $("filters").replaceChildren(...FILTERS.map(([key, label]) => h("button", {
    type: "button", "aria-pressed": String(state.filter === key), title: `${counts[key]} ${label.toLowerCase()}`,
    onclick: () => { state.filter = key; renderFilters(); renderList(); },
  }, label)));
}

function renderList() {
  const tasks = visibleTasks();
  const rows = tasks.map((task) => {
    const status = statusOf(task.status);
    return h("button", {
      type: "button", class: "row", "aria-current": String(task.id === state.selected), "data-id": task.id,
      title: `${task.title} — ${status.label}`, onclick: () => select(task.id),
    },
      h("span", { class: `dot tone-${status.tone}${task.status === "running" ? " pulse" : ""}` }),
      h("span", { class: "row-main" },
        h("span", { class: "row-title" }, task.title || task.id),
        h("span", { class: "row-sub" }, `${agentName(task.developer)} → ${agentName(task.reviewer)} · Iteration ${task.iteration ?? "?"}`)),
      h("span", { class: "row-time" }, ago(task.updated_at, true)));
  });
  const label = h("div", { class: "list-label" }, state.filter === "all" ? "Recent" : FILTERS.find(([k]) => k === state.filter)[1]);
  const empty = h("div", { class: "list-empty" }, state.overview ? [rondo(), state.query ? "No matching tasks" : "No tasks"] : "Loading…");
  $("list").replaceChildren(label, ...(rows.length ? rows : [empty]));
}

function renderFooter() {
  const repo = state.overview?.config?.repository;
  $("repo").textContent = repo ? repo.split(/[\\/]/).filter(Boolean).pop() : (state.overview?.config_error ? "Not configured" : "");
  $("repo").title = repo || state.overview?.config_error || "";
  const tone = state.online ? "green" : "red";
  $("live").replaceChildren(h("span", { class: `dot tone-${tone}${state.online ? " pulse" : ""}` }), h("span", {}, state.online ? "Live" : "Offline"));
}

function toolbar(title, ...actions) {
  return h("div", { class: "toolbar" },
    h("button", { class: "back", type: "button", onclick: () => select(null) }, icon("chevronLeft"), "Tasks"),
    h("div", { class: "toolbar-title" }, title),
    actions);
}

function toast(message, error = false) {
  const el = $("toast");
  el.classList.toggle("error", error);
  el.replaceChildren(icon(error ? "warning" : "check"), message);
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), error ? 4000 : 1800);
}

function copyButton(label, text) {
  return h("button", {
    type: "button", class: "tool-btn", title: text,
    onclick: async () => {
      try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
      catch { toast("Copy unavailable"); }
    },
  }, icon("copy"), label);
}

function section(title, note, body) {
  return h("section", { class: "section" },
    h("div", { class: "section-head" }, h("h2", {}, title), note ? h("span", { class: "section-note" }, note) : null),
    body);
}

function renderOverview() {
  const overview = state.overview;
  const tasks = overview?.tasks || [];
  const cfg = overview?.config;
  const counts = Object.fromEntries(Object.keys(STATUS).map((key) => [key, 0]));
  for (const task of tasks) if (task.status in counts) counts[task.status]++;
  const tiles = Object.entries(STATUS).map(([key, meta]) => h("button", {
    type: "button", class: `card tile tone-${meta.tone}`,
    onclick: () => { state.filter = key === "done" || key === "blocked" ? key : "active"; renderFilters(); renderList(); },
  }, h("div", { class: "tile-icon" }, icon(meta.icon)), h("div", { class: "tile-count" }, counts[key]), h("div", { class: "tile-label" }, meta.label)));

  const settings = cfg ? h("div", { class: "card group" },
    settingRow("Repository", h("span", { class: "mono" }, cfg.repository)),
    settingRow("Tests", cfg.tests_enabled ? h("span", { class: "badge-on" }, `Enabled · ${cfg.test_commands} command${cfg.test_commands === 1 ? "" : "s"}`) : h("span", { class: "badge-off" }, "Disabled")),
    settingRow("Max iterations", String(cfg.max_iterations)),
    settingRow("Local retrieval", cfg.rag_enabled ? h("span", { class: "badge-on" }, "Enabled") : h("span", { class: "badge-off" }, "Disabled")),
    settingRow("Quota recovery", cfg.recovery_enabled ? h("span", { class: "badge-on" }, "Enabled") : h("span", { class: "badge-off" }, "Disabled")),
    settingRow("State directory", h("span", { class: "mono" }, overview.home)))
    : h("div", { class: "alert tone-orange" }, icon("warning"), h("div", {},
        h("div", { class: "alert-title" }, "Configuration unavailable"),
        h("div", { class: "alert-body" }, overview?.config_error || "Waiting for data…")));

  const welcome = tasks.length ? null : h("div", { class: "card welcome" },
    rondo("bob"),
    h("h2", {}, "No tasks yet"),
    h("div", {}, "Describe what to build; Claude and Codex take turns developing and reviewing."),
    h("button", { type: "button", class: "btn primary", onclick: newTaskSheet }, "New Task"));

  return h("div", { class: "content fade-in" },
    h("div", { class: "hero hero-row" },
      h("div", {}, h("div", { class: "eyebrow" }, "Dashboard"), h("h1", {}, "Overview")),
      tasks.length ? [h("div", { class: "bubble", role: "status" }, boardMessage(counts, tasks.length, cfg)), rondo(counts.running ? "bob" : "")] : null),
    welcome,
    h("div", { class: "tiles" }, tiles),
    section("Configuration", cfg ? h("button", { type: "button", class: "link-btn", onclick: testsSheet }, "Edit tests") : null, settings));
}

function settingRow(label, value) {
  return h("div", { class: "item setting" }, h("div", { class: "item-main" }, h("div", { class: "item-title" }, label)),
    h("div", { class: "item-trail" }, value));
}

function stepper(task) {
  const current = STEPS.findIndex(([key]) => key === task.phase);
  const tone = task.status === "blocked" ? "red" : task.status === "paused" ? "orange" : task.status === "running" ? "purple" : "blue";
  return h("div", { class: "card stepper" }, STEPS.map(([key, label], index) => {
    const done = task.status === "done" || (current >= 0 && index < current);
    const active = !done && index === current;
    return h("div", { class: `step${done ? " done" : ""}${active ? ` current tone-${tone}` : ""}` },
      h("div", { class: `step-node${active && task.status === "running" ? " pulse" : ""}` }, done ? icon("check") : null),
      h("div", {}, label));
  }));
}

function statTile(label, iconName, value, extra) {
  return h("div", { class: "card stat" }, h("div", { class: "stat-label" }, icon(iconName), label), h("div", { class: "stat-value" }, value), extra);
}

function testsSummary(tests) {
  if (!tests?.length) return { value: "—", tone: "gray" };
  if (tests.every((t) => t.status === "skipped")) return { value: "Off", tone: "gray" };
  const passed = tests.filter((t) => t.status === "passed").length;
  return { value: [String(passed), h("small", {}, ` / ${tests.length}`)], tone: passed === tests.length ? "green" : "red" };
}

function errorAlert(error, status) {
  if (!error) return null;
  const kind = typeof error === "object" ? error.kind : error;
  const message = typeof error === "object" ? error.message : null;
  const tone = status === "blocked" ? "red" : "orange";
  return h("div", { class: `alert tone-${tone}` }, icon("warning"), h("div", {},
    h("div", { class: "alert-title" }, humanize(kind || "Interrupted")),
    message ? h("div", { class: "alert-body" }, message) : null));
}

// Shows the persisted plan only: waiting and retrying belong to the `patchrondo run` process.
function recoveryCard(task) {
  const plan = task.recovery;
  if (!plan || typeof plan !== "object") return null;
  const used = plan.consecutive_failures, limit = plan.max_consecutive_retries;
  const rows = [settingRow("Provider at its limit", agentName(plan.provider))];
  if (plan.status === "scheduled") {
    rows.push(settingRow("Planned retry", h("span", { title: plan.resume_at }, `${fullDate(plan.resume_at)} · ${ago(plan.resume_at)}`)),
      settingRow("Schedule source", RECOVERY_SOURCES[plan.schedule_source] || humanize(plan.schedule_source)));
  }
  if (plan.status === "stopped") rows.push(settingRow("Stopped because", RECOVERY_STOPS[plan.stop_reason] || `${humanize(plan.stop_reason)} is not retried automatically`));
  if (Number.isInteger(used) && Number.isInteger(limit)) rows.push(settingRow("Automatic retries", `${Math.min(used, limit)} of ${limit} used · ${Math.max(limit - used, 0)} left`));
  const note = plan.status === "scheduled" ? "The retry happens only while a run with automatic resume is waiting. Otherwise the plan stays saved and the task stays paused."
    : plan.status === "stopped" ? "Automatic recovery has ended. Resume manually when the cause is resolved."
    : "A planned retry is in progress.";
  return section("Quota recovery", humanize(plan.status), h("div", { class: "card group" }, rows, h("div", { class: "empty-row" }, note)));
}

function reviewCard(review) {
  if (!review) return h("div", { class: "card" }, h("div", { class: "empty-row" }, "No review completed yet"));
  const verdict = VERDICTS[review.verdict] || { label: review.verdict, tone: "gray", icon: "eye" };
  const issues = (review.issues || []).map((issue) => h("div", { class: "item" },
    h("span", { class: `sev tone-${SEVERITY[issue.severity] || "gray"}` }, issue.severity),
    h("div", { class: "item-main" },
      h("div", { class: "item-title" }, issue.description),
      issue.path ? h("div", { class: "item-sub mono" }, issue.path) : null)));
  return h("div", { class: "card" },
    h("div", { class: `verdict tone-${verdict.tone}` }, h("div", { class: "verdict-icon" }, icon(verdict.icon)),
      h("div", {}, h("div", { class: "verdict-title" }, verdict.label),
        h("div", { class: "item-sub" }, `${(review.issues || []).length} issue${(review.issues || []).length === 1 ? "" : "s"}`))),
    h("div", { class: "summary" }, review.summary || ""),
    issues.length ? h("div", { class: "group" }, issues) : h("div", { class: "empty-row" }, "No issues reported"));
}

function testsCard(tests) {
  if (!tests?.length) return h("div", { class: "card" }, h("div", { class: "empty-row" }, "Tests have not run yet"));
  const tone = { passed: "green", failed: "red", timeout: "orange", skipped: "gray" };
  return h("div", { class: "card group" }, tests.map((test) => h("div", { class: "item" },
    h("span", { class: `sev tone-${tone[test.status] || "gray"}` }, test.status),
    h("div", { class: "item-main" },
      h("div", { class: "item-title mono" }, test.command?.length ? test.command.join(" ") : "(no command)"),
      test.message ? h("div", { class: "item-sub" }, test.message) : null,
      test.output_tail && test.status !== "passed" ? h("div", { class: "md" }, h("pre", {}, h("code", {}, test.output_tail))) : null),
    test.returncode != null ? h("span", { class: "item-trail mono" }, `exit ${test.returncode}`) : null)));
}

function eventTone(event) {
  const name = event.event || "";
  if (/blocked|failed/.test(name) || (event.statuses || []).some((s) => s !== "passed" && s !== "skipped")) return "red";
  if (/paused/.test(name)) return "orange";
  if (/completed/.test(name)) return "green";
  if (/started/.test(name)) return "blue";
  return "gray";
}

function eventDetail(event) {
  const parts = [];
  if (event.agent) parts.push(agentName(event.agent));
  if (event.verdict) parts.push(VERDICTS[event.verdict]?.label || event.verdict);
  if (event.reason) parts.push(humanize(event.reason));
  if (event.statuses) parts.push(event.statuses.join(", "));
  if (event.previous_status) parts.push(`from ${event.previous_status}`);
  if (event.attempt) parts.push(`retry ${event.attempt}`);
  if (event.resume_at || event.scheduled_for) parts.push(`at ${fullDate(event.resume_at || event.scheduled_for)}`);
  if (event.source) parts.push(RECOVERY_SOURCES[event.source] || humanize(event.source));
  if (event.message) parts.push(event.message);
  return parts.join(" · ");
}

function timelineCard(history) {
  if (!history?.length) return h("div", { class: "card" }, h("div", { class: "empty-row" }, "No events yet"));
  const events = [...history].reverse().slice(0, 60);
  return h("div", { class: "card group timeline" }, events.map((event) => h("div", { class: `item tone-${eventTone(event)}` },
    h("span", { class: "tl-dot" }), h("span", { class: "tl-line" }),
    h("div", { class: "item-main" },
      h("div", { class: "item-title" }, humanize(event.event)),
      eventDetail(event) ? h("div", { class: "item-sub" }, eventDetail(event)) : null),
    h("span", { class: "item-trail", title: fullDate(event.at) }, h("span", { class: "chip" }, `Iter ${event.iteration}`), " ", ago(event.at, true)))));
}

function documentsCard(documents) {
  const available = DOCS.filter(([key]) => documents?.[key]);
  if (!available.length) return h("div", { class: "card" }, h("div", { class: "empty-row" }, "No documents yet"));
  if (!documents[state.doc]) state.doc = available[0][0];
  const view = (key) => key === "log" ? h("div", { class: "md" }, h("pre", {}, h("code", {}, documents[key]))) : markdown(documents[key]);
  const body = h("div", {}, view(state.doc));
  const tabs = h("div", { class: "segmented", role: "tablist" }, DOCS.map(([key, label]) => h("button", {
    type: "button", role: "tab", "aria-pressed": String(state.doc === key), disabled: !documents[key],
    onclick: () => {
      state.doc = key;
      [...tabs.children].forEach((button, index) => button.setAttribute("aria-pressed", String(DOCS[index][0] === key)));
      body.replaceChildren(view(key));
    },
  }, label)));
  return h("div", { class: "card" }, h("div", { class: "doc-head" }, tabs), body);
}

function renderTask(detail) {
  const task = detail.state;
  const status = statusOf(task.status);
  const max = state.overview?.config?.max_iterations;
  const iteration = task.iteration ?? 0;
  const tests = testsSummary(task.tests);
  const label = runLabel(detail);
  const action = label
    ? h("button", { type: "button", class: "tool-btn primary", onclick: () => confirmRun(detail) }, icon(label === "Run" ? "play" : "repeat"), label)
    : task.status === "running" ? h("button", { type: "button", class: "tool-btn status", disabled: true }, h("span", { class: "dot pulse" }), "Running…") : null;
  return [
    toolbar(task.title, copyButton(h("span", { class: "mono" }, task.id), task.id), action),
    h("div", { class: "content fade-in" },
      h("div", { class: "hero" },
        h("div", { class: "eyebrow" },
          h("span", { class: `pill tone-${status.tone}` }, h("span", { class: `dot${task.status === "running" ? " pulse" : ""}` }), status.label),
          h("span", { title: fullDate(task.created_at) }, `Created ${ago(task.created_at)}`)),
        h("h1", {}, task.title),
        h("div", { class: "agents" },
          agentChip(task.developer, "Developer"), h("span", { class: "arrow" }, icon("arrow")), agentChip(task.reviewer, "Reviewer"))),
      stepper(task),
      rondoNote(detail),
      h("div", { class: "stats" },
        statTile("Iteration", "repeat", [String(iteration), max ? h("small", {}, ` / ${max}`) : null],
          max ? h("div", { class: `meter tone-${status.tone}` }, h("span", { style: `width:${Math.min(100, iteration / max * 100)}%` })) : null),
        statTile("Phase", "stack", humanize(task.phase)),
        statTile("Tests", "flask", tests.value),
        statTile("Updated", "clock", ago(task.updated_at, true))),
      errorAlert(task.last_error, task.status),
      recoveryCard(task),
      section("Review", task.review ? `by ${agentName(task.reviewer)}` : null, reviewCard(task.review)),
      section("Tests", null, testsCard(task.tests)),
      section("Activity", `${(task.history || []).length} events`, timelineCard(task.history)),
      section("Documents", null, documentsCard(detail.documents))),
  ];
}

function agentChip(name, role) {
  return h("span", { class: "agent" },
    h("span", { class: `agent-avatar ${name}` }, agentName(name).charAt(0)),
    agentName(name), h("span", { class: "agent-role" }, role));
}

function renderDetail() {
  const main = $("detail");
  if (!state.selected) {
    main.replaceChildren(toolbar("Overview"), renderOverview());
    return;
  }
  if (!state.detail) {
    main.replaceChildren(toolbar(""), h("div", { class: "content" }, h("div", { class: "loading" }, h("div", { class: "rondo-face bob", "aria-hidden": "true" }), "Loading…")));
    return;
  }
  const scroll = main.scrollTop;
  main.replaceChildren(...renderTask(state.detail));
  main.scrollTop = scroll;
  for (const el of main.querySelectorAll(".fade-in")) el.classList.remove("fade-in");
}

async function refreshDetail() {
  const id = state.selected;
  if (!id) return;
  try {
    const detail = await api(`/api/tasks/${encodeURIComponent(id)}`);
    if (id !== state.selected) return;
    const key = JSON.stringify(detail);
    if (key === state.detailKey) return;
    const first = !state.detail;
    state.detail = detail;
    state.detailKey = key;
    renderDetail();
    if (first) $("detail").querySelector(".content")?.classList.add("fade-in");
  } catch (error) {
    if (error.status === 404 && id === state.selected) select(null);
  }
}

async function refresh() {
  try {
    const overview = await api("/api/overview");
    const key = JSON.stringify(overview);
    state.online = true;
    if (key !== state.overviewKey) {
      state.overview = overview;
      state.overviewKey = key;
      renderFilters();
      renderList();
      if (!state.selected) renderDetail();
    }
    renderFooter();
    await refreshDetail();
  } catch (error) {
    state.online = false;
    renderFooter();
    if (error.status === 401) {
      $("repo").textContent = "Session token missing — reopen the URL printed by patchrondo ui";
    }
  }
}

$("search").addEventListener("input", (event) => { state.query = event.target.value; renderList(); });
$("brand").addEventListener("click", () => select(null));
$("new-task").addEventListener("click", newTaskSheet);
$("brand").addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(null); } });
$("detail").addEventListener("scroll", (event) => event.target.classList.toggle("scrolled", event.target.scrollTop > 40));
document.addEventListener("keydown", (event) => {
  if (document.querySelector(".backdrop") || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.target.closest("input, textarea")) {
    if (event.key === "Escape") event.target.blur();
    return;
  }
  if (event.key === "/") { event.preventDefault(); $("search").focus(); return; }
  if (event.key === "n") { event.preventDefault(); newTaskSheet(); return; }
  if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
  const tasks = visibleTasks();
  if (!tasks.length) return;
  event.preventDefault();
  const index = tasks.findIndex((task) => task.id === state.selected);
  const next = event.key === "ArrowDown" ? Math.min(tasks.length - 1, index + 1) : Math.max(0, index - 1);
  select(tasks[next].id);
  $("list").querySelector(`[data-id="${tasks[next].id}"]`)?.scrollIntoView({ block: "nearest" });
});

if (state.selected) $("app").classList.add("show-detail");
renderFilters();
renderList();
renderFooter();
renderDetail();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
