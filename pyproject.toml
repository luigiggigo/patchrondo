[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchrondo"
version = "0.1.0"
description = "Local, resumable Claude Code / Codex review-and-repair loop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "orchestration", "code-review", "claude", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.scripts]
patchrondo = "patchrondo.cli:main"

[project.urls]
Homepage = "https://github.com/luigiggigo/patchrondo"
Repository = "https://github.com/luigiggigo/patchrondo"
Issues = "https://github.com/luigiggigo/patchrondo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchrondo = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
